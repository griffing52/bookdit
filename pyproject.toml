[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name; the import package is `bookdit` (src/bookdit/).
name = "bookdit"
version = "0.1.0"
description = "BookDiT: Reducing Autoregressive Rollout Drift in Limit Order Book World Models"
readme = "README.md"
license = {text = "MIT"}  # the gap-profile table and the overview image are CC BY-NC 4.0 (see LICENSE)
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "tqdm>=4.66",
  "py7zr>=0.21",
  "pyarrow>=15.0",  # the parquet engine behind pandas.read_parquet
  "scipy>=1.11",
  "sortedcontainers>=2.4",
  "statsmodels>=0.14",  # module-scope import of libs/lob_bench
  "seaborn>=0.13",  # module-scope import of libs/lob_bench/plotting.py
  "plotly>=5.22",  # module-scope import of libs/lob_bench/plotting.py
]

[project.urls]
Repository = "https://github.com/griffing52/bookdit"

[project.optional-dependencies]
# An extra rather than a dependency group so both documented installers reach it:
# `uv sync --frozen --extra dev` and `pip install -e ".[dev]"`.
dev = ["pytest>=8.0"]
# JAX stack for the CST and LOB-S5 baseline drivers. Install it into a separate
# environment; see docs/REPRODUCE.md §1.2.
baselines = ["jax", "jaxlib", "flax", "chex"]

[tool.pytest.ini_options]
# Without testpaths, bare `pytest` walks the third-party clones under libs/.
testpaths = ["tests"]
norecursedirs = ["libs", "runs", "data", ".venv"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
